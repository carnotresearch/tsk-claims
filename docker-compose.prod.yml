##
# Production Docker Compose — HTTP only (no SSL, no source code on VM)
#
# Usage on VM:
#   cp .env.example .env        # fill in POSTGRES_PASSWORD, SECRET_KEY, GEMINI_API_KEY
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec backend python scripts/seed_demo.py
#
# Exposes port 80. Open port 80 in GCP firewall rules.
# Images are built locally and pushed to Docker Hub — no source code on this VM.
##

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hsk_claims}
      POSTGRES_USER: ${POSTGRES_USER:-hsk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsk} -d ${POSTGRES_DB:-hsk_claims}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKER_USER}/hsk-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hsk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hsk_claims}
      SECRET_KEY: ${SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      SYNC_SOURCE: ${SYNC_SOURCE:-upload}
      EXCEL_FILE_PATH: /app/uploads/latest.xlsx
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - excel_uploads:/app/uploads

  frontend:
    image: ${DOCKER_USER}/hsk-frontend:latest
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  excel_uploads:
