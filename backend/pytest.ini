[pytest]
asyncio_mode = auto
# pytest-asyncio 0.24+: share one event loop across session-scoped async fixtures
asyncio_default_fixture_loop_scope = session

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

markers =
    unit: pure unit tests, no DB or network
    integration: requires a running PostgreSQL database
    api: requires the full FastAPI app + database
