server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve React SPA — send all unknown routes to index.html
    location / {
        try_files $uri /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
